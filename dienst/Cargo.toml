[package]
name = "wf-dienst"
version = "0.1.0"
edition = "2021"

# Die Netzseite von wegfinder fuer MeeGo Harmattan und Sailfish OS: liest
# Anfragen von stdin, spricht mit api.i-mobility.at, schreibt kompakte
# Antworten nach stdout (Zeilenformat wie bei den Bahn-Ports, siehe
# meego/src/Dienst.h). Dazu ein kleiner Kachel-Zwischenspeicher fuer die
# Karte am N9 (127.0.0.1, siehe kacheln.rs).

[dependencies]
# TLS ueber native-tls -> OpenSSL, statisch mitkompiliert: Qt 4.7 auf dem N9
# kann kein TLS 1.2. gzip spart im 2G-Netz das Meiste: eine Routensuche
# kommt mit 2 statt 15 KB.
ureq = { version = "2.12", default-features = false, features = ["native-tls", "gzip"] }
native-tls = { version = "0.2", features = ["vendored"] }
url = "2"
serde_json = "1"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
